name: Build signed APK & AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/new-session-9h26z5

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build unsigned release APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          # The action defaults to build-tools 29.0.3, which no longer exists
          # on ubuntu-latest runners. Pin to a version the runner image ships.
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Sign AAB
        id: sign_aab
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      # Rename the signed outputs to stable, friendly file names before publishing.
      - name: Stage release files
        run: |
          mkdir -p dist
          cp "${{ steps.sign_apk.outputs.signedReleaseFile }}" dist/FocusDrift-release.apk
          cp "${{ steps.sign_aab.outputs.signedReleaseFile }}" dist/FocusDrift-release.aab

      # Publish to a rolling GitHub Release instead of Actions artifacts: release assets do
      # not count against the Actions artifact storage quota, which repeatedly filled up and
      # made upload-artifact fail even though the build and signing succeeded.
      - name: Publish APK & AAB to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build (auto)
          body: |
            Rolling release updated automatically by CI on every push.
            - FocusDrift-release.aab — upload this to Google Play
            - FocusDrift-release.apk — signed release APK for direct install
          prerelease: true
          files: |
            dist/FocusDrift-release.apk
            dist/FocusDrift-release.aab

  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Debug builds auto-unlock every Pro feature (see SubscriptionRepositoryImpl) and are
      # signed with the auto-generated debug keystore, so no signing secrets are needed here.
      # Use this build for demoing/testing the full feature set without a real purchase.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Stage debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FocusDrift-debug.apk

      # Separate tag from the release job: both jobs run in parallel, and racing to create
      # the same release on first run can fail one of them.
      - name: Publish debug APK to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build (auto)
          body: |
            Rolling debug build updated automatically by CI on every push.
            FocusDrift-debug.apk has all Pro features unlocked — for testing only.
          prerelease: true
          files: dist/FocusDrift-debug.apk
